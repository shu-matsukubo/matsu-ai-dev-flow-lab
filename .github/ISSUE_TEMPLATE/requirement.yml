name: 要求
description: 1つの要求原文と、Issue登録前の任意の補足を記録する
title: "[要求] "
labels: ["人間：要求承認待ち"]
body:
  - type: textarea
    id: original-request
    attributes:
      label: 要求
      description: 要求者から受け取った要求原文を、AIによる要約や解釈へ置き換えず、原則として内容を変えずにコピーしてください。
      placeholder: 要求者から受け取った要求原文をそのまま貼り付けてください。
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        要求分析はIssue登録後にCodexが別ファイルとして作成します。このIssueへ完成した要求分析を記載する必要はありません。
  - type: textarea
    id: supplement
    attributes:
      label: 補足
      description: Issue登録前の会話や壁打ちで得られた思考材料があれば、自由に記載してください。完成した仕様書や要求分析へ整形する必要はありません。
      placeholder: |
        例:
        - 背景や意図、優先順位
        - 検討した案と採用・棄却した理由
        - 懸念や、まだ決めていない事項
    validations:
      required: false
