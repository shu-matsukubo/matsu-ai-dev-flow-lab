name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - 'issue/**'
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ソース取得
        uses: actions/checkout@v4
      - name: 品質検証
        run: sh scripts/verify.sh
